name: Deploy to Netlify

on:
  push:
    branches:
      - claude/cool-knuth-rClsT
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stroll-hub/package-lock.json

      - name: Install
        run: npm ci
        working-directory: stroll-hub

      - name: Build
        run: npm run build
        working-directory: stroll-hub

      - name: Deploy
        run: npx netlify-cli deploy --prod --dir=dist --site=${{ secrets.NETLIFY_SITE_ID }}
        working-directory: stroll-hub
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
