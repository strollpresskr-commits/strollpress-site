        { title: '호끌락 문화학교 — 2주차', time: '미정', clients: ['호끌락'], prep: '콘텐츠 확정·동의 필요' },
        { title: '하례초 — 촬영', time: '미정', clients: ['하례초'] }
      ] },
    { date: '6/4',  day: '목',
      events: [{ title: '호끌락 문화학교 — 3주차', time: '미정', clients: ['호끌락'] }] },
    { date: '6/5',  day: '금',
      events: [{ title: '하례초 — 편집 1차', time: '', clients: ['하례초'] }] },
    { date: '6/10', day: '수',
      events: [{ title: '하례초 — 클라이언트 검수', time: '', clients: ['하례초'], isMeeting: true }] },
    { date: '6/17', day: '수',
      events: [{ title: '하례초 — 최종 수정', time: '', clients: ['하례초'] }] },
    { date: '6/20', day: '토',
      events: [{ title: '하례초 — 납품 마감', time: '', clients: ['하례초'], prep: '최종 납품' }] },
    { date: 'TBD',  day: '',
      events: [{ title: '잇수다 남은 촬영 2건', time: '미정', desc: '용천수 잠복취재 · 제주도청 과장님 인터뷰', clients: ['잇수다'], isTbd: true }] }
  ];

  function daysUntil(s) {
    if (!s) return null;
    try { return Math.ceil((new Date(s+'T00:00:00') - new Date(new Date().toDateString())) / 86400000); }
    catch(e) { return null; }
  }
  function ddayLabel(n) { return n===null?null:n<0?`D+${Math.abs(n)}`:n===0?'D-DAY':`D-${n}`; }
  function ddayClass(n)  { return n===null?'dday-ok':n<=3?'dday-urgent':n<=10?'dday-warn':'dday-ok'; }
  function badgeClass(c) { return c==='외주'?'badge-out':c==='자체'?'badge-self':'badge-sys'; }

  function fmtBudget(b) {
    if (!b) return null;
    const gross = b.amount / 10000;
    let label = gross.toLocaleString() + '만원';
    if (b.vatSep) label += ' (VAT별도)';
    if (b.deduction) {
      const ded = b.deduction.amount / 10000;
      const net = gross - ded;
      label += ` · 실수령 ${net.toLocaleString()}만원 (${b.deduction.label} -${ded}만)`;
    }
    return label;
  }

  function riskLevel(p) {
    const d = DATA[p.file]||{};
    const deadline = d.meta&&d.meta.deadline;
    const dLeft = deadline ? daysUntil(deadline) : null;
    const total = (d.todos&&d.todos.length||0) + (d.done||0);
    const pct   = total > 0 ? (d.done||0)/total : 0;
    if (dLeft !== null && dLeft < 0) return 'overdue';
    if (dLeft !== null && dLeft <= 14 && pct < 0.5) return 'critical';
    if (dLeft !== null && dLeft <= 28 && pct < 0.35) return 'warning';
    if (!deadline && (d.todos&&d.todos.length||0) > 12) return 'watch';
    return dLeft !== null ? 'ok' : 'none';
  }
  function riskReason(p) {
    const d = DATA[p.file]||{};
    const deadline = d.meta&&d.meta.deadline;
    const dLeft = deadline ? daysUntil(deadline) : null;
    const total = (d.todos&&d.todos.length||0) + (d.done||0);
    const pct   = total > 0 ? Math.round((d.done||0)/total*100) : 0;
    if (!deadline) return '마감 미설정 · 할 일 ' + (d.todos&&d.todos.length||0) + '개';
    return `D-${dLeft} · 완료 ${pct}%`;
  }

  function renderWeekPulse() {
    const thisWeekEvents = SCHEDULE.filter(s => s.thisWeek);
    const evCount = thisWeekEvents.reduce((acc, s) => acc + s.events.length, 0);
    const critical = PROJECTS.filter(p => riskLevel(p)==='critical'||riskLevel(p)==='overdue');
    const warning  = PROJECTS.filter(p => riskLevel(p)==='warning');
    const deadlines = PROJECTS.filter(p => {
      const d = DATA[p.file]||{};
      const dl = d.meta&&d.meta.deadline ? daysUntil(d.meta.deadline) : null;
      return dl !== null && dl >= 0 && dl <= 30;
    });
    const nearest = deadlines.sort((a,b)=>{
      return daysUntil((DATA[a.file]?.meta?.deadline)||'9999-12-31') - daysUntil((DATA[b.file]?.meta?.deadline)||'9999-12-31');
    })[0];
    const nearestDays = nearest ? daysUntil(DATA[nearest.file]?.meta?.deadline) : null;

    // 총 예산 합산
    const totalBudget = Object.values(DATA)
      .filter(d => d.budget)
      .reduce((sum, d) => sum + d.budget.amount, 0);

    document.getElementById('week-pulse-wrap').innerHTML = `
      <div class="section-label">이번 주 현황</div>
      <div class="week-pulse" style="margin-bottom:22px;">
        <div class="pulse-stat">
          <div class="pulse-val ${evCount>=3?'amber':''}">${evCount}</div>
          <div class="pulse-lbl">이번 주 일정</div>
        </div>
        <div class="pulse-divider"></div>
        <div class="pulse-stat">
          <div class="pulse-val ${critical.length>0?'red':warning.length>0?'amber':'green'}">${critical.length+warning.length}</div>
          <div class="pulse-lbl">주의 프로젝트</div>
        </div>
        <div class="pulse-divider"></div>
        <div class="pulse-stat">
          <div class="pulse-val ${nearestDays!==null&&nearestDays<=14?'amber':''}">${nearestDays!==null?'D-'+nearestDays:'—'}</div>
          <div class="pulse-lbl">가장 가까운 마감</div>
        </div>
        <div class="pulse-divider"></div>
        <div class="pulse-stat">
          <div class="pulse-val" style="font-size:16px;padding-top:2px;">${(totalBudget/10000).toLocaleString()}만</div>
          <div class="pulse-lbl">진행 중 총 예산</div>
        </div>
      </div>`;
  }

  function renderRisk() {
    const critical = PROJECTS.filter(p => { const r=riskLevel(p); return r==='critical'||r==='overdue'; });
    const warning  = PROJECTS.filter(p => riskLevel(p)==='warning');
    const watch    = PROJECTS.filter(p => riskLevel(p)==='watch');
    let html = '';
    if (critical.length) {
      html += `<div class="risk-banner critical">
        <div class="risk-label">🔴 즉시 점검 필요</div>
        ${critical.map(p=>`<div class="risk-row">
          <div><span class="risk-name">${p.name}</span><span class="risk-reason" style="margin-left:8px;">${riskReason(p)}</span></div>
          <span class="risk-tag tag-critical">위험</span>
        </div>`).join('')}
      </div>`;
    }
    if (warning.length) {
      html += `<div class="risk-banner warning">
        <div class="risk-label">🟡 주의 모니터링</div>
        ${warning.map(p=>`<div class="risk-row">
          <div><span class="risk-name">${p.name}</span><span class="risk-reason" style="margin-left:8px;">${riskReason(p)}</span></div>
          <span class="risk-tag tag-warning">주의</span>
        </div>`).join('')}
      </div>`;
    }
    if (watch.length) {
      html += `<div class="risk-banner" style="background:#f9f9f9;border:1px solid #e8e8e8;">
        <div class="risk-label" style="color:#666;">⚪ 마감 확인 필요</div>
        ${watch.map(p=>`<div class="risk-row">
          <div><span class="risk-name">${p.name}</span><span class="risk-reason" style="margin-left:8px;">${riskReason(p)}</span></div>
          <span class="risk-tag tag-watch">일정 미정</span>
        </div>`).join('')}
      </div>`;
    }
    document.getElementById('risk-wrap').innerHTML = html ? `<div style="margin-bottom:22px;">${html}</div>` : '';
  }

  function renderUrgency() {
    const urgent = PROJECTS.filter(p => {
      const m = DATA[p.file]?.meta||{}, date = m.deadline||m.start;
      if (!date) return false;
      const d = daysUntil(date); return d!==null && d<=14;
    });
    if (!urgent.length) { document.getElementById('urgency-wrap').innerHTML=''; return; }
    const rows = urgent.map(p => {
      const m=DATA[p.file]?.meta||{}, date=m.deadline||m.start, d=daysUntil(date);
      const rem=(DATA[p.file]?.todos||[]).length;
      return `<div class="urgency-row"><div class="urgency-name">${p.name}</div>
        <div class="urgency-right">${rem>0?`<span class="remaining-txt">할 일 ${rem}개</span>`:''}
        <span class="dday ${ddayClass(d)}">${ddayLabel(d)}</span></div></div>`;
    }).join('');
    document.getElementById('urgency-wrap').innerHTML =
      `<div class="urgency-card"><div class="urgency-label">⏰ D-14 이내 주의</div>${rows}</div>`;
  }

  function renderSchedule() {
    const rows = SCHEDULE.map((day, i) => {
      const isLast = i === SCHEDULE.length - 1;
      const dotCls = day.dotCls || (day.thisWeek ? 'thisweek' : '');
      const eventsHTML = day.events.map(ev => {
        const clientTags = (ev.clients||[]).map(c=>`<span class="ttag ttag-client">${c}</span>`).join('');
        const typeTag = ev.isDone    ? `<span class="ttag ttag-done">✓ 완료</span>`
                      : ev.isTbd    ? `<span class="ttag ttag-tbd">일정 미정</span>`
                      : ev.isMeeting? `<span class="ttag ttag-meeting">미팅</span>`
                      : day.thisWeek? `<span class="ttag ttag-thisweek">이번 주</span>`
                      : `<span class="ttag ttag-shoot">촬영·작업</span>`;
        const prepTag = ev.prep ? `<span class="ttag ttag-prep">⚡ ${ev.prep}</span>` : '';
        const evCls = ev.isDone ? ' done-ev' : day.thisWeek ? ' thisweek-ev' : '';
        return `<div class="timeline-event${evCls}">
          <div class="timeline-event-top">${ev.time?`<span class="timeline-time">${ev.time}</span>`:''}<span class="timeline-title">${ev.title}</span></div>
          ${ev.desc?`<div class="timeline-desc">${ev.desc}</div>`:''}
          <div class="timeline-tags">${typeTag}${clientTags}${prepTag}</div></div>`;
      }).join('');
      return `<div class="timeline-day">
        <div class="timeline-date"><div class="tdate">${day.date}</div>${day.day?`<div class="tday">${day.day}요일</div>`:''}</div>
        <div class="timeline-dot-col"><div class="timeline-dot${dotCls?' '+dotCls:''}"></div>${!isLast?'<div class="timeline-line"></div>':''}</div>
        <div class="timeline-body">${eventsHTML}</div></div>`;
    }).join('');
    return `<div class="section-label">촬영 · 미팅 · 마일스톤</div><div class="schedule-section" style="margin-bottom:24px;">${rows}</div>`;
  }

  function renderCard(p) {
    const d = DATA[p.file]||{ todos:[], done:0, meta:{}, highlights:[], budget:null };
    const tasks=d.todos||[], doneN=d.done||0, total=tasks.length+doneN;
    const pct = total>0 ? Math.round((doneN/total)*100) : 0;
    const date=d.meta&&d.meta.deadline, dd=daysUntil(date);
    const hi = new Set(d.highlights||[]);
    const rl = riskLevel(p);
    const riskDotCls = rl==='critical'||rl==='overdue'?'critical':rl==='warning'?'warning':rl==='watch'?'watch':rl==='ok'?'ok':'none';
    const fillCls = rl==='critical'||rl==='overdue'?'fill-critical':rl==='warning'?'fill-warning':'';
    const cardCls = rl==='critical'||rl==='overdue'?'card-risk-critical':rl==='warning'?'card-risk-warning':'';
    const taskHTML = tasks.length>0
      ? `<ul class="task-list">
          ${tasks.slice(0,5).map(t=>`<li class="task-item${hi.has(t)?' highlight':''}"><div class="task-box"></div><span>${t}</span></li>`).join('')}
          ${tasks.length>5?`<li class="more-tasks">+ ${tasks.length-5}개 더</li>`:''}
        </ul>`
      : `<div class="no-tasks">✓ 현재 할 일 없음</div>`;
    const fp=[];
    if (p.memo) fp.push(p.memo);
    if (date&&dd!==null) fp.push(`마감 ${date} · ${ddayLabel(dd)}`);
    const budgetStr = fmtBudget(d.budget);
    const budgetHTML = budgetStr
      ? `<span class="budget-badge budget-${d.budget.status}" title="${budgetStr}">${(d.budget.amount/10000).toLocaleString()}만원${d.budget.vatSep?' +VAT':''}</span>`
      : `<span class="budget-badge budget-none">예산 미입력</span>`;
    return `<div class="card ${cardCls}">
      <div class="card-top">
        <div class="card-name">${p.name}</div>
        <div class="card-badges">
          <div class="risk-dot ${riskDotCls}" title="${rl}"></div>
          <span class="badge ${badgeClass(p.cat)}">${p.cat}</span>
        </div>
      </div>
      <div class="prog-track"><div class="prog-fill ${fillCls}" style="width:${pct}%"></div></div>
      <div class="prog-text">${doneN}/${total} 완료 · ${pct}%</div>
      ${taskHTML}
      <div class="card-footer">
        <span>${fp.join(' · ')}</span>
        ${budgetHTML}
      </div>
    </div>`;
  }

  function render() {
    renderWeekPulse();
    renderRisk();
    renderUrgency();
    const section = (label, projs, wide) => `
      <div class="section-label">${label}</div>
      <div class="grid${wide?' wide':''}">
        ${projs.map(p=>renderCard(p)).join('')}
      </div>`;
    document.getElementById('main-wrap').innerHTML =
      renderSchedule() +
      section('외주 프로젝트', PROJECTS.filter(p=>p.cat==='외주'), false) +
      section('자체 프로젝트', PROJECTS.filter(p=>p.cat==='자체'), false) +
      section('시스템 구축',   PROJECTS.filter(p=>p.cat==='시스템'), true);
  }

  render();
</script>
</body>
</html>
